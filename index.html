<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GMFLIX</title>
<style>
:root{--g:rgba(255,255,255,.12);--gb:rgba(255,255,255,.22);--t:#fff;--m:rgba(255,255,255,.65);--a:#0a84ff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hind Siliguri",system-ui,sans-serif;color:var(--t);min-height:100vh;
 background:#000;padding-bottom:110px}
.glass{background:var(--g);border:1px solid var(--gb);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-radius:22px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) 18px 0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{font-size:1.7rem;font-weight:800;letter-spacing:-.04em}
input,select{background:rgba(255,255,255,.14);border:1px solid var(--gb);border-radius:14px;padding:.7rem 1rem;width:100%;outline:0}
input::placeholder{color:var(--m)}
select option{color:#000}
.btn{background:var(--a);border:0;border-radius:14px;padding:.7rem 1.3rem;font-weight:600}
.btn.s{background:var(--g);border:1px solid var(--gb)}
.btn.d{background:#ff453a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{aspect-ratio:2/3;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;border:1px solid var(--gb);border-radius:20px;position:relative;overflow:hidden}
.card b{font-size:1.05rem;line-height:1.15}
.card small{color:var(--m)}
.pin{position:absolute;top:10px;left:10px;font-size:.75rem;padding:.2rem .6rem;border-radius:99px;background:rgba(0,0,0,.4)}
h2{font-size:1.4rem;margin:6px 0 14px}
.p{padding:20px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--gb)}
.muted{color:var(--m);font-size:.9rem}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;padding:8px;gap:4px;width:min(440px,92vw);border-radius:30px;z-index:5}
.tabs button{flex:1;background:none;border:0;padding:.6rem .2rem;border-radius:22px;color:var(--m);font-size:.85rem}
.tabs button.on{background:rgba(255,255,255,.22);color:#fff}
.hide{display:none!important}
dialog{border:0;background:none;color:#fff;width:min(960px,96vw);max-height:96vh;margin:auto;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.7);backdrop-filter:blur(8px)}
#pl{padding:16px}
video{width:100%;max-height:68vh;background:#000;border-radius:16px;display:block}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.ctl label{font-size:.8rem;color:var(--m);display:block;margin-bottom:4px}
.hero{min-height:240px;border-radius:24px;display:flex;align-items:flex-end;padding:24px;margin-bottom:22px;border:1px solid var(--gb)}
.hero h1{font-size:clamp(2rem,6vw,3.2rem);letter-spacing:-.03em;line-height:1.05;margin:4px 0 16px}
.track{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;margin-bottom:12px}
.cw{flex:0 0 150px}
.bar{height:4px;background:rgba(255,255,255,.3);border-radius:4px;margin-top:10px}
.bar i{display:block;height:100%;background:#fff;border-radius:4px}
.av{width:48px;height:48px;border-radius:50%;background:var(--g);border:1px solid var(--gb);display:grid;place-items:center;font-weight:700}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <div class="top"><div class="logo">GMFLIX</div><input id="q" type="search" placeholder="Search" aria-label="Search"></div>
  <section id="v-home">
    <div id="hero" class="hero hide"><div><p class="muted" id="hh"></p><h1 id="ht"></h1><button class="btn" id="hp">▶ Play</button></div></div>
    <div id="contw" class="hide"><h2>Continue watching</h2><div id="cont" class="track"></div></div>
    <h2>All videos</h2><div id="grid" class="grid"></div></section>
  <section id="v-request" class="hide"><h2>Request</h2><div class="glass p">
    <input id="rq" placeholder="কোন ভিডিও চান তার নাম লিখুন"><div class="row"><button class="btn" id="rqb">Send request</button></div>
    <div id="rql" style="margin-top:14px"></div></div></section>
  <section id="v-history" class="hide"><h2>History</h2><div class="glass p" id="hl"></div></section>
  <section id="v-account" class="hide"><h2>Account</h2>
    <div class="glass p" id="lf"><p class="muted" style="margin-bottom:14px">আপনার Gmail ঠিকানা দিয়ে ঢুকুন। লগইন করলে দেখা ভিডিও History-তে জমা হবে।</p>
      <input id="em" type="email" placeholder="name@gmail.com" autocomplete="email">
      <p id="err" class="muted" style="color:#ff9f9a;margin-top:8px"></p>
      <button class="btn" id="go" style="width:100%;margin-top:14px">Continue</button></div>
    <div class="glass p hide" id="li"><div class="row" style="margin:0"><div class="av" id="av"></div><p id="acc"></p></div>
      <div class="row"><button class="btn s" id="out">Sign out</button><button class="btn hide" id="adm">Admin panel</button></div></div></section>
  <section id="v-admin" class="hide"><h2>Admin panel</h2>
    <div class="glass p"><b>ভিডিও আপলোড</b>
      <div class="row"><input id="at" placeholder="Title"></div>
      <div class="row"><input id="af" type="file" accept="video/mp4,video/webm,video/quicktime,.mp4,.webm,.mov,.mkv"></div>
      <p class="muted" style="margin-top:6px">ব্রাউজার MP4 (H.264 + AAC) ও WebM চালাতে পারে। MKV অনেক সময় চলে না, তাই MP4 করে নিন।</p>
      <div class="row"><input id="sf" type="file" accept=".vtt"><select id="sl" style="max-width:160px"><option>English</option><option>বাংলা</option><option>Hindi</option><option>Arabic</option></select></div>
      <p class="muted" style="margin-top:6px">সাবটাইটেল ঐচ্ছিক, শুধু .vtt ফাইল।</p>
      <div class="row"><button class="btn" id="up">Upload</button><span id="us" class="muted"></span></div><p id="sq" class="muted" style="margin-top:10px"></p></div>
    <div class="glass p"><b>আপনার ভিডিও</b><div id="al"></div></div>
  </section>
</div>

<nav class="tabs glass" aria-label="Main">
  <button data-v="home" class="on">Home</button><button data-v="request">Request</button><button data-v="history">History</button><button data-v="account">Account</button>
</nav>

<dialog id="dlg"><div class="glass" id="pl">
  <div class="row" style="justify-content:space-between;margin:0 0 10px"><b id="pt"></b><button class="btn s" id="pc">Close</button></div>
  <video id="vid" controls playsinline></video>
  <div class="ctl">
    <div><label for="ar">Aspect ratio</label><select id="ar"><option value="contain">Fit</option><option value="cover">Fill</option><option value="fill">Stretch</option></select></div>
    <div><label for="au">Audio language</label><select id="au"><option>Default</option></select></div>
    <div><label for="su">Subtitles</label><select id="su"><option value="-1">Off</option></select></div>
    <div><label>&nbsp;</label><button class="btn s" id="fs" style="width:100%">Full screen</button></div>
  </div>
</div></dialog>

<script>
// ===== সেটিংস: এখানে আপনার অ্যাডমিন Gmail বসান =====
const ADMIN = "yourname@gmail.com";
// ====================================================
const $ = id => document.getElementById(id);
const LS = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } };
const SV = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} };

// ---- IndexedDB (ভিডিও ফাইল এই ব্রাউজারেই থাকে) ----
let db;
const open = () => new Promise((ok, no) => {
  const r = indexedDB.open('gmflix', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('v', { keyPath: 'id' });
  r.onsuccess = () => { db = r.result; ok() }; r.onerror = no;
});
const tx = (m, f) => new Promise((ok, no) => { const s = db.transaction('v', m).objectStore('v'); const r = f(s); r.onsuccess = () => ok(r.result); r.onerror = no });
const all = () => tx('readonly', s => s.getAll());
const put = v => tx('readwrite', s => s.put(v));
const del = id => tx('readwrite', s => s.delete(id));

let user = LS('user', null), videos = [];
const isAdmin = () => user && user.toLowerCase() === ADMIN.toLowerCase();

// ---- Login ----
$('go').onclick = () => {
  const e = $('em').value.trim();
  if (!/^[^\s@]+@gmail\.com$/i.test(e)) { $('err').textContent = 'একটি সঠিক Gmail ঠিকানা দিন'; return }
  user = e; SV('user', e); boot(); show('home');
};
$('em').addEventListener('keydown', e => e.key === 'Enter' && $('go').click());
$('out').onclick = () => { localStorage.removeItem('user'); location.reload() };

function boot() {
  $('lf').classList.toggle('hide', !!user);
  $('li').classList.toggle('hide', !user);
  $('acc').textContent = user || '';
  $('av').textContent = user ? user[0].toUpperCase() : '';
  $('adm').classList.toggle('hide', !isAdmin());
  refresh();
}

// ---- Tabs ----
function show(v) {
  ['home','request','history','account','admin'].forEach(n => $('v-' + n).classList.toggle('hide', n !== v));
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (v === 'history') renderHistory();
  if (v === 'request') renderReq();
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => show(b.dataset.v));
$('adm').onclick = () => { if (isAdmin()) show('admin') };

// ---- Home grid ----
async function refresh() {
  videos = (await all()).sort((a, b) => (b.pinned - a.pinned) || (b.created - a.created));
  renderGrid(); renderAdmin(); quota();
}
async function quota() {
  try {
    if (navigator.storage && navigator.storage.persist) await navigator.storage.persist();
    const e = await navigator.storage.estimate();
    $('sq').textContent = 'এই ব্রাউজারে জায়গা: ' + (e.usage / 1e9).toFixed(2) + ' GB ব্যবহৃত, মোট প্রায় ' + (e.quota / 1e9).toFixed(1) + ' GB';
  } catch {}
}
function renderExtras() {
  const h = $('hero'), top = videos[0];
  if (!top) h.classList.add('hide');
  else {
    h.classList.remove('hide');
    const hue = top.created % 360;
    h.style.background = `linear-gradient(to top,hsl(${hue} 50% 8% / .95),hsl(${hue} 60% 38% / .85))`;
    $('ht').textContent = top.title; $('hh').textContent = top.pinned ? 'Top pick' : 'New';
    $('hp').onclick = () => play(top);
  }
  const p = user ? LS('prog:' + user, {}) : {}, c = $('cont'); c.innerHTML = '';
  const items = videos.filter(v => p[v.id] && p[v.id].t > 5 && p[v.id].t < p[v.id].d - 10);
  $('contw').classList.toggle('hide', !items.length);
  items.forEach(v => {
    const b = document.createElement('button'), hue = v.created % 360;
    b.className = 'card cw';
    b.style.background = `linear-gradient(to top,hsl(${hue} 50% 10% / .9),hsl(${hue} 60% 40% / .8))`;
    b.innerHTML = '<b></b><div class="bar"><i></i></div>';
    b.firstChild.textContent = v.title;
    b.querySelector('i').style.width = (p[v.id].t / p[v.id].d * 100) + '%';
    b.onclick = () => play(v); c.appendChild(b);
  });
}
function renderGrid() {
  renderExtras();
  const q = $('q').value.toLowerCase(), g = $('grid');
  g.innerHTML = '';
  const list = videos.filter(v => v.title.toLowerCase().includes(q));
  if (!list.length) { g.innerHTML = '<p class="muted">এখনো কোনো ভিডিও নেই।' + (isAdmin() ? ' Account → Admin panel থেকে আপলোড করুন।' : '') + '</p>'; return }
  list.forEach(v => {
    const h = (v.created % 360);
    const b = document.createElement('button');
    b.className = 'card';
    b.style.background = `linear-gradient(to top,hsl(${h} 50% 10% / .9),hsl(${h} 60% 40% / .8))`;
    b.innerHTML = (v.pinned ? '<span class="pin">📌 Top</span>' : '') + '<b></b>';
    b.querySelector('b').textContent = v.title;
    b.onclick = () => play(v);
    g.appendChild(b);
  });
}
$('q').oninput = renderGrid;

// ---- Player ----
let urls = [];
function play(v) {
  if (!user) { show('account'); $('err').textContent = 'ভিডিও দেখতে আগে লগইন করুন'; return }
  cur = v;
  urls.forEach(URL.revokeObjectURL); urls = [];
  const vid = $('vid'); vid.innerHTML = '';
  const src = URL.createObjectURL(v.blob); urls.push(src); vid.src = src;
  $('pt').textContent = v.title;
  const su = $('su'); su.innerHTML = '<option value="-1">Off</option>';
  (v.subs || []).forEach((s, i) => {
    const u = URL.createObjectURL(s.blob); urls.push(u);
    const t = document.createElement('track'); t.kind = 'subtitles'; t.label = s.lang; t.src = u; vid.appendChild(t);
    su.insertAdjacentHTML('beforeend', `<option value="${i}">${s.lang}</option>`);
  });
  setTimeout(() => [...vid.textTracks].forEach(t => t.mode = 'disabled'), 50);
  vid.style.objectFit = 'contain'; $('ar').value = 'contain';
  $('au').innerHTML = '<option value="-1">Default</option>';
  vid.onloadedmetadata = () => {
    const sp = LS('prog:' + user, {})[v.id]; if (sp && sp.t > 5 && sp.t < sp.d - 10) vid.currentTime = sp.t;
    const at = vid.audioTracks;
    if (at && at.length > 1) { $('au').innerHTML = ''; for (let i = 0; i < at.length; i++) { const o = document.createElement('option'); o.value = i; o.textContent = at[i].label || at[i].language || 'Track ' + (i + 1); o.selected = at[i].enabled; $('au').appendChild(o) } }
  };
  $('dlg').showModal(); vid.play().catch(() => {});
  const h = LS('hist:' + user, []).filter(x => x.id !== v.id);
  h.unshift({ id: v.id, title: v.title, at: Date.now() }); SV('hist:' + user, h.slice(0, 50));
}
$('ar').onchange = e => $('vid').style.objectFit = e.target.value;
$('au').onchange = e => { const at = $('vid').audioTracks; if (at) for (let i = 0; i < at.length; i++) at[i].enabled = i == e.target.value };
$('su').onchange = e => [...$('vid').textTracks].forEach((t, i) => t.mode = i == e.target.value ? 'showing' : 'disabled');
$('fs').onclick = () => { const v = $('vid'); (v.requestFullscreen || v.webkitEnterFullscreen).call(v) };
let cur = null, lastSave = 0;
$('vid').ontimeupdate = () => {
  const vid = $('vid'), now = Date.now();
  if (!cur || !user || now - lastSave < 4000 || !vid.duration) return;
  lastSave = now;
  const p = LS('prog:' + user, {}); p[cur.id] = { t: vid.currentTime, d: vid.duration }; SV('prog:' + user, p);
};
const closeP = () => { $('vid').pause(); $('dlg').close(); renderGrid() };
$('pc').onclick = closeP;
$('dlg').addEventListener('click', e => { if (e.target === $('dlg')) closeP() });

// ---- History / Request ----
function renderHistory() {
  if (!user) { $('hl').innerHTML = '<p class="muted">History দেখতে Account ট্যাব থেকে লগইন করুন।</p>'; return }
  const h = LS('hist:' + user, []);
  $('hl').innerHTML = h.length ? '' : '<p class="muted">এখনো কিছু দেখা হয়নি।</p>';
  h.forEach(x => { const d = document.createElement('div'); d.className = 'item'; d.innerHTML = '<span></span><span class="muted">' + new Date(x.at).toLocaleDateString() + '</span>'; d.firstChild.textContent = x.title; $('hl').appendChild(d) });
}
function renderReq() {
  const r = LS('reqs', []);
  $('rql').innerHTML = r.length ? '' : '<p class="muted">কোনো রিকোয়েস্ট নেই।</p>';
  r.forEach(x => { const d = document.createElement('div'); d.className = 'item'; d.innerHTML = '<span></span><span class="muted"></span>'; d.children[0].textContent = x.title; d.children[1].textContent = x.by; $('rql').appendChild(d) });
}
$('rqb').onclick = () => { if (!user) { show('account'); return } const t = $('rq').value.trim(); if (!t) return; const r = LS('reqs', []); r.unshift({ title: t, by: user }); SV('reqs', r); $('rq').value = ''; renderReq() };

// ---- Admin ----
$('up').onclick = async () => {
  if (!isAdmin()) return;
  const f = $('af').files[0], t = $('at').value.trim();
  if (!f || !t) { $('us').textContent = 'টাইটেল ও ভিডিও ফাইল দিন'; return }
  const subs = $('sf').files[0] ? [{ lang: $('sl').value, blob: $('sf').files[0] }] : [];
  try { await put({ id: crypto.randomUUID(), title: t, blob: f, subs, pinned: 0, created: Date.now() }); $('us').textContent = 'আপলোড হয়েছে'; $('at').value = ''; $('af').value = ''; $('sf').value = ''; refresh() }
  catch { $('us').textContent = 'সেভ হয়নি। জায়গা কম থাকতে পারে।' }
};
function renderAdmin() {
  const a = $('al'); a.innerHTML = videos.length ? '' : '<p class="muted">কিছু নেই।</p>';
  videos.forEach(v => {
    const d = document.createElement('div'); d.className = 'item';
    d.innerHTML = '<span></span><span class="row" style="margin:0"><button class="btn s">' + (v.pinned ? 'Unpin' : 'Pin to top') + '</button><button class="btn s">Edit</button><button class="btn d">Delete</button></span>';
    d.firstChild.textContent = (v.pinned ? '📌 ' : '') + v.title;
    const [p, e, x] = d.querySelectorAll('button');
    p.onclick = async () => { v.pinned = v.pinned ? 0 : 1; await put(v); refresh() };
    e.onclick = async () => { const n = prompt('নতুন টাইটেল', v.title); if (n && n.trim()) { v.title = n.trim(); await put(v); refresh() } };
    x.onclick = async () => { if (confirm('"' + v.title + '" মুছে ফেলবেন?')) { await del(v.id); refresh() } };
    a.appendChild(d);
  });
}

open().then(boot);
</script>
</body>
</html>
